<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket League Mini</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gameCanvas" aria-label="Rocket League style game"></canvas>

    <div id="hud">
      <div class="scoreboard">
        <div class="team blue">BLUE <span id="scoreBlue">0</span></div>
        <div class="divider">:</div>
        <div class="team orange">ORANGE <span id="scoreOrange">0</span></div>
      </div>

      <div class="status-wrap">
        <div class="boost-box">
          <span>BOOST</span>
          <div class="boost-bar"><div id="boostFill"></div></div>
        </div>
        <div id="statusText">Ready for kickoff</div>
      </div>
    </div>

    <div id="menu" class="menu visible">
      <div class="panel">
        <div class="title-wrap">
          <div class="logo">RL</div>
          <div>
            <h1>Rocket League Mini</h1>
            <p>Arcade physics, air roll, boost and power slide</p>
          </div>
        </div>

        <div class="menu-actions">
          <button id="startBtn" class="primary">Play Now</button>
          <button id="resumeBtn" class="secondary hidden">Resume</button>
          <button id="resetBtn" class="secondary">Reset Match</button>
        </div>

        <div class="settings-block">
          <label for="graphicsSelect">Graphics</label>
          <select id="graphicsSelect">
            <option value="very low">Very Low</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="settings-block compact">
          <label>
            <input type="checkbox" id="particleToggle" checked />
            Particles
          </label>
          <label>
            <input type="checkbox" id="trailToggle" checked />
            Motion Trails
          </label>
        </div>

        <div class="controls">
          <h2>Controls</h2>
          <ul>
            <li>Drive: W/A/S/D or Arrow Keys</li>
            <li>Boost: Shift</li>
            <li>Jump: Space</li>
            <li>Air Roll: Q / E</li>
            <li>Power Slide: C</li>
            <li>Flip Reset: R</li>
            <li>Pause: Esc</li>
          </ul>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
